services:
  - type: web
    name: thread-ai-api
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LLM_PROVIDER
        value: auto
      - key: GEMINI_MODEL_NAME
        value: gemini-3.5-flash-lite
      - key: COOKIE_SECURE
        value: true
      - key: SESSION_DAYS
        value: 14
      - key: ALLOW_DEV_AUTH
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: thread-ai-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: BACKEND_URL
        sync: false

databases:
  - name: thread-ai-db
    plan: starter
